<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>전문대학 학사학위 전공심화 운영진단 편람</title>
  <meta name="description" content="전문대학 학사학위 전공심화과정 3주기 운영진단 편람의 구분·분야·영역·진단지표를 모바일에서 열람하는 페이지">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171d26" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4fd1'/%3E%3Cpath d='M18 18h20l8 8v20H18z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 32h16M24 40h10' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>try{var t=localStorage.getItem('jsh-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <h1 class="hero-title"><span class="ht-1">전문대학 학사학위 전공심화</span> <span class="ht-2">운영진단 편람</span></h1>
      </div>
      <div class="hero-actions">
        <button class="settings-btn menu-btn" id="menuBtn" aria-label="목차 열기" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>목차</span>
        </button>
      <button class="settings-btn" id="settingsBtn" aria-label="설정" aria-haspopup="true" aria-expanded="false" aria-controls="settingsPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>설정</span>
      </button>
      </div>
      <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="설정" hidden>
        <div class="settings-org"><span>발행 기관</span><img src="assets/img/kcce-logo.png" alt="한국전문대학교육협의회" width="343" height="36"></div>
        <details class="settings-theme" id="themeBox">
          <summary><span id="themeLbl">화면 바탕</span><b id="themeCur">자동</b><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></summary>
          <div class="theme-seg" role="group" aria-labelledby="themeLbl">
            <button type="button" data-theme-set="auto" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>자동</button>
            <button type="button" data-theme-set="light" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>흰 바탕</button>
            <button type="button" data-theme-set="dark" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>검은 바탕</button>
          </div>
        </details>
        <label class="settings-row" for="hbSelect"><span>기준 편람</span>
          <select id="hbSelect" class="settings-select"></select>
        </label>
        <div class="settings-grid" id="hbInfo"></div>
        <button type="button" class="settings-item" id="summaryOpen" aria-haspopup="dialog" aria-controls="docModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 9v11"/></svg>
          <span>진단지표 총괄표</span><small>편람 10쪽</small>
        </button>
        <button type="button" class="settings-item" id="quantOpen" aria-haspopup="dialog" aria-controls="docModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h8M8 17h5"/></svg>
          <span>정량요소 총괄표</span><small>편람 11쪽</small>
        </button>
        <button type="button" class="settings-item" id="changesOpen" aria-haspopup="dialog" aria-controls="docModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h7M4 17h11"/><path d="M17 10l3 3-3 3"/></svg>
          <span>3주기 변경사항</span><small>원문 17쪽</small>
        </button>
        <div class="settings-contact"><span>담당자 연락처</span><a href="tel:043-230-2122"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>043-230-2122</a></div>
        <div class="settings-maker"><span>웹페이지</span><b><img id="ccuLogo" src="assets/img/ccu-symbol.png" alt="" width="20" height="20" onerror="this.remove()">충청대학교 교수학습지원실</b></div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="편람 목차"></aside>
    <div class="scrim" id="scrim"></div>

    <div class="content">
      <main id="app" aria-live="polite">
        <div class="state" role="status"><div class="spinner" aria-hidden="true"></div><b>편람을 불러오는 중입니다</b><p>잠시만 기다려 주세요.</p><noscript><p>이 페이지는 JavaScript가 켜져 있어야 볼 수 있습니다.</p></noscript></div>
      </main>

      <footer id="footer"></footer>
    </div>
  </div>


  <div class="modal" id="docModal" role="dialog" aria-modal="true" aria-labelledby="docTitle" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <b id="docTitle"></b>
        <a class="modal-pdf" id="docPdf" href="#" target="_blank" rel="noopener">PDF로 열기</a>
        <button type="button" class="modal-close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="zoom-ctl" role="group" aria-label="확대·축소">
        <button type="button" data-zoom="-" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <output id="zoomVal" aria-live="polite">100%</output>
        <button type="button" data-zoom="+" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="modal-body" id="docBody"></div>
    </div>
  </div>

  <button class="top-btn" id="topBtn" aria-label="맨 위로">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <nav class="tabbar" aria-label="주 메뉴">
    <div class="tabbar-inner">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        지표체계
      </a>
      <a href="#/plan" data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        기본계획
      </a>
      <a href="#/changes" data-tab="changes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h7M4 17h11"/><path d="M17 10l3 3-3 3"/></svg>
        변경사항
      </a>
      <a href="#/search" data-tab="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        검색
      </a>
    </div>
  </nav>

  <script src="assets/app.js"></script>
</body>
</html>
